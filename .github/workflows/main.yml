name: Deploy Cartilha ENADE 2026

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install

      - name: Build do projeto
        run: bun run build

      - name: Preparar arquivos estáticos para GitHub Pages
        run: |
          mkdir -p gh-pages-dist
          FOUND_DIR=""
          for dir in ".output/public" "dist/client" "dist/public" "dist"; do
            if [ -f "$dir/index.html" ] || [ -f "$dir/_shell.html" ]; then
              FOUND_DIR="$dir"
              break
            fi
          done

          if [ -n "$FOUND_DIR" ]; then
            echo "Arquivos estáticos encontrados em: $FOUND_DIR"
            cp -r "$FOUND_DIR"/* gh-pages-dist/
            if [ ! -f "gh-pages-dist/index.html" ] && [ -f "gh-pages-dist/_shell.html" ]; then
              cp gh-pages-dist/_shell.html gh-pages-dist/index.html
            fi
            if [ -d "public" ]; then
              cp -rn public/* gh-pages-dist/ 2>/dev/null || true
            fi
            cp gh-pages-dist/index.html gh-pages-dist/404.html
          else
            echo "Estrutura gerada em dist e .output:"
            find dist .output -maxdepth 4 2>/dev/null || true
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload do build
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./gh-pages-dist"

      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
