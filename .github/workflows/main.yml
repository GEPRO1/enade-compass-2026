name: Deploy Cartilha ENADE 2026

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install

      - name: Build do projeto
        run: bun run build

      - name: Preparar arquivos estáticos para GitHub Pages
        run: |
          mkdir -p gh-pages-dist
          if [ -f ".output/public/index.html" ]; then
            cp -r .output/public/* gh-pages-dist/
          elif [ -f "dist/client/index.html" ]; then
            cp -r dist/client/* gh-pages-dist/
          elif [ -f "dist/index.html" ]; then
            cp -r dist/* gh-pages-dist/
          else
            echo "Estrutura gerada:"
            find . -maxdepth 3 -not -path '*/node_modules/*'
            exit 1
          fi
          cp gh-pages-dist/index.html gh-pages-dist/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload do build
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./gh-pages-dist"

      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
